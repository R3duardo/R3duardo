      56%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes nx-s3 {
      0%, 52% { stroke-dashoffset: 100; }
      68%, 100% { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nx-ring, .nx-n, .nx-s1, .nx-s2, .nx-s3 { animation: none; }
    }
  </style>
  <defs>

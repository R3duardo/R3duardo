<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .nx-ring { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 100 100; stroke-dashoffset: 0; animation: nx-ring 4.5s ease-in-out infinite; }
    .nx-n { animation: nx-n 4.5s ease-in-out infinite; }
    .nx-s { fill: none; stroke: #fff; stroke-dasharray: 100 100; stroke-dashoffset: 0; }
    .nx-s1 { animation: nx-s1 4.5s ease-in-out infinite; }
    .nx-s2 { animation: nx-s2 4.5s ease-in-out infinite; }
    .nx-s3 { animation: nx-s3 4.5s ease-in-out infinite; }
    @keyframes nx-ring {
      0% { stroke-dashoffset: 100; }
      24%, 86% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes nx-n {
      0%, 86% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes nx-s1 {
      0%, 14% { stroke-dashoffset: 100; }
      32%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes nx-s2 {

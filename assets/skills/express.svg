<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .ex-cover { display: none; }
    .ex-cursor { display: none; }
    @keyframes ex-type {
      0%, 10% { transform: translateX(0); }
      10.1%, 26% { transform: translateX(65px); }
      26.1%, 95% { transform: translateX(132px); }
      95.1%, 100% { transform: translateX(0); }
    }
    @keyframes ex-move {
      0%, 10% { transform: translateX(0); }
      10.1%, 26% { transform: translateX(69px); }
      26.1%, 95% { transform: translateX(135px); }
      95.1%, 100% { transform: translateX(0); }
    }
    @keyframes ex-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes ex-glow {
      0%, 26% { stroke: #3d444d; }
      40% { stroke: #8b949e; }
      60%, 100% { stroke: #3d444d; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .ex-cover { display: inline; animation: ex-type 4s linear infinite; }
      .ex-cursor { display: inline; animation: ex-move 4s linear infinite; }
      .ex-cursor rect { animation: ex-blink .8s steps(1, end) infinite; }
      .ex-card { animation: ex-glow 4s ease-in-out infinite; }
    }
  </style>
  <defs><clipPath id="ex-clip"><rect x="4" y="22" width="120" height="84" rx="14"/></clipPath></defs>
  <rect class="ex-card" x="4" y="22" width="120" height="84" rx="14" fill="#1f2328" stroke="#3d444d" stroke-width="2.5"/>
  <g clip-path="url(#ex-clip)"><g transform="translate(14 14) scale(.78)">
    <path fill="#fff" d="M126.67 98.44c-4.56 1.16-7.38.05-9.91-3.75-5.68-8.51-11.95-16.63-18-24.9-.78-1.07-1.59-2.12-2.6-3.45C89 76 81.85 85.2 75.14 94.77c-2.4 3.42-4.92 4.91-9.4 3.7l26.92-36.13L67.6 29.71c4.31-.84 7.29-.41 9.93 3.45 5.83 8.52 12.26 16.63 18.67 25.21 6.45-8.55 12.8-16.67 18.8-25.11 2.41-3.42 5-4.72 9.33-3.46-3.28 4.35-6.49 8.63-9.72 12.88-4.36 5.73-8.64 11.53-13.16 17.14-1.61 2-1.35 3.3.09 5.19C109.9 76 118.16 87.1 126.67 98.44zM1.33 61.74c.72-3.61 1.2-7.29 2.2-10.83 6-21.43 30.6-30.34 47.5-17.06C60.93 41.64 63.39 52.62 62.9 65H7.1c-.84 22.21 15.15 35.62 35.53 28.78 7.15-2.4 11.36-8 13.47-15 1.07-3.51 2.84-4.06 6.14-3.06-1.69 8.76-5.52 16.08-13.52 20.66-12 6.86-29.13 4.64-38.14-4.89C5.26 85.89 3 78.92 2 71.39c-.15-1.2-.46-2.38-.7-3.57q.03-3.04.03-6.08zm5.87-1.49h50.43c-.33-16.06-10.33-27.47-24-27.57-15-.12-25.78 11.02-26.43 27.57z"/>
    <rect class="ex-cover" x="-2" y="20" width="132" height="90" fill="#1f2328"/>
    <g class="ex-cursor"><rect x="-6" y="30" width="4.5" height="68" fill="#58a6ff"/></g>
  </g></g>
</svg>

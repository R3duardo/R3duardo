<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .nj-logo { transform-origin: 64px 64px; }
    .nj-ring { fill: none; stroke: #b9f27c; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 0; }
    .nj-spark { fill: #fff; opacity: 0; }
    @keyframes nj-pulse {
      0%, 8% { transform: scale(1); }
      45% { transform: scale(1.07); }
      60%, 100% { transform: scale(1); }
    }
    @keyframes nj-draw {
      0% { stroke-dashoffset: 1; opacity: 1; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      72% { stroke-dashoffset: 0; opacity: 1; }
      92%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes nj-spin {
      0% { stroke-dashoffset: 0; opacity: 0; }
      50% { opacity: 0; }
      55% { opacity: .9; }
      100% { stroke-dashoffset: -1; opacity: .9; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .nj-logo { animation: nj-pulse 4s ease-in-out infinite; }
      .nj-ring { animation: nj-draw 4s ease-in-out infinite; }
    }
  </style>

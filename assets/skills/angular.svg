<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .ng-left { animation: ng-left 4.5s cubic-bezier(.3,1.3,.5,1) infinite; }
    .ng-right { animation: ng-right 4.5s cubic-bezier(.3,1.3,.5,1) infinite; }
    .ng-glint { animation: ng-glint 4.5s ease-in-out infinite; }
    @keyframes ng-left {
      0% { transform: translate(-26px, 22px); opacity: 0; }
      16%, 90% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(-26px, 22px); opacity: 0; }
    }
    @keyframes ng-right {
      0% { transform: translate(26px, 22px); opacity: 0; }
      16%, 90% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(26px, 22px); opacity: 0; }
    }
    @keyframes ng-glint {
      0%, 40% { transform: translateX(0); }
      75%, 100% { transform: translateX(190px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ng-left, .ng-right, .ng-glint { animation: none; }
      .ng-glint { display: none; }
    }
  </style>
  <defs>
    <clipPath id="ng-shield"><path d="M64 15.36L16.33 32.36l7.27 63.03L64 117.76l40.4-22.37 7.27-63.03z"/></clipPath>
    <clipPath id="ng-half-l"><rect x="0" y="0" width="64.4" height="128"/></clipPath>
    <clipPath id="ng-half-r"><rect x="63.6" y="0" width="64.4" height="128"/></clipPath>
    <path id="ng-a" d="M64 26.68L34.2 93.49h11.11l5.99-14.95h25.29l5.99 14.95h11.11zM72.7 69.32H55.3L64 48.38z"/>
  </defs>
  <path fill="#DD0031" d="M64 15.36L16.33 32.36l7.27 63.03L64 117.76l40.4-22.37 7.27-63.03z"/>
  <path fill="#C3002F" d="M64 15.36V117.76l40.4-22.37 7.27-63.03z"/>
  <g clip-path="url(#ng-half-l)"><g class="ng-left"><use href="#ng-a" fill="#fff"/></g></g>
  <g clip-path="url(#ng-half-r)"><g class="ng-right"><use href="#ng-a" fill="#fff"/></g></g>
  <g clip-path="url(#ng-shield)">
    <path class="ng-glint" fill="#fff" fill-opacity=".38" d="M0 0H18L-6 128H-24z"/>
  </g>
</svg>

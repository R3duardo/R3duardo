<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .h5-outline { fill: none; stroke: #E44D26; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 100 100; stroke-dashoffset: 0; animation: h5-draw 4s ease-in-out infinite; }
    .h5-fill { animation: h5-fill 4s ease-in-out infinite; }
    .h5-mark { transform-box: fill-box; transform-origin: center; animation: h5-pop 4s ease-out infinite; }
    @keyframes h5-draw {
      0% { stroke-dashoffset: 100; opacity: 1; }
      32%, 88% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes h5-fill {
      0%, 28% { opacity: 0; }
      42%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes h5-pop {
      0%, 38% { opacity: 0; transform: translateY(8px) scale(.9); }
      54%, 88% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .h5-outline, .h5-fill, .h5-mark { animation: none; }
    }
  </style>
  <g class="h5-fill">
    <path fill="#E44D26" d="M19.037 113.876L9.032 1.661h109.936l-10.016 112.198-45.019 12.48z"/>
    <path fill="#F16529" d="M64 116.8l36.378-10.086 8.559-95.878H64z"/>
  </g>
  <g class="h5-mark">
